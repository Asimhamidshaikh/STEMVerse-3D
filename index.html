<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STEM 3D Interactive Lab</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Three.js and OrbitControls Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="app">
    <!-- Sidebar Controls -->
    <aside id="sidebar">
      <div class="header">
        <h2>STEM 3D Lab</h2>
        <span class="badge">O-Level Edition</span>
      </div>

      <!-- Module Selection Tabs -->
      <div class="tab-group">
        <button id="tab-optics" class="tab-btn active">Optics (Physics)</button>
        <button id="tab-orbits" class="tab-btn">Orbits (Physics)</button>
        <button id="tab-chem" class="tab-btn">Chemistry</button>
      </div>

      <!-- Dynamic Controls Panel -->
      <div id="controls-panel" class="panel-section">
        <!-- Controls rendered dynamically via JS -->
      </div>

      <!-- Visual Angle Diagram Section (Optics) -->
      <div id="diagram-section" class="panel-section" style="display: none;">
        <h3>2D Angle Diagram</h3>
        <svg id="optics-svg" viewBox="0 0 200 120" style="width: 100%; height: auto; background: #111827; border-radius: 6px; margin-top: 6px;">
          <!-- Boundary interface -->
          <line x1="10" y1="60" x2="190" y2="60" stroke="#374151" stroke-width="2" />
          <!-- Normal line -->
          <line x1="100" y1="10" x2="100" y2="110" stroke="#9ca3af" stroke-dasharray="4" stroke-width="1.5" />
          <!-- Incident ray -->
          <line id="svg-inc-ray" x1="50" y1="15" x2="100" y2="60" stroke="#facc15" stroke-width="2.5" />
          <!-- Refracted ray -->
          <line id="svg-ref-ray" x1="100" y1="60" x2="130" y2="105" stroke="#38bdf8" stroke-width="2.5" />
          <!-- Labels -->
          <text x="15" y="45" fill="#9ca3af" font-size="10">Air (n1)</text>
          <text x="15" y="80" fill="#38bdf8" font-size="10">Medium (n2)</text>
          <text id="svg-text-i" x="80" y="35" fill="#facc15" font-size="11">i</text>
          <text id="svg-text-r" x="110" y="85" fill="#38bdf8" font-size="11">r</text>
        </svg>
      </div>

      <!-- Dynamic Data Inspector Panel -->
      <div class="panel-section">
        <h3>Live Metrics & Math</h3>
        <div id="metrics-content" class="inspector-card">
          <!-- Metrics rendered dynamically via JS -->
        </div>
      </div>
    </aside>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
